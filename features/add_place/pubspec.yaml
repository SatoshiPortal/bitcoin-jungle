name: add_place
description: Bitcoin Jungle's "add a place" form, with the BTC Map submission fields, sent through Bitcoin Jungle's proxy to BTC Map.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.14.0"
  flutter: "3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.1.4
  intl: any
  btc_map:
  bull_ui:
  dio: ^5.9.0
  material_ui: ^1.11.0
  meta: ^1.17.0
  primitives:

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  # Fakes the native map in widget tests, pinned like btc_map's.
  maplibre_gl: 0.27.1

flutter:
  generate: true
  uses-material-design: true
